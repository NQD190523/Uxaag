# Microservices Configuration
services:
  main:
    host: "0.0.0.0"
    port: 8000
    description: "Main RAG Chat Room Web application"
  
  api-gateway:
    host: "0.0.0.0"
    port: 8000
    description: "API Gateway for routing requests"
  
  document:
    host: "0.0.0.0"
    port: 8001
    description: "Document extraction and processing service"
  
  rag:
    host: "0.0.0.0"
    port: 8002
    description: "Retrieval-Augmented Generation service"
  
  vector-store:
    host: "0.0.0.0"
    port: 8003
    description: "Vector database operations service"
  
  web-crawler:
    host: "0.0.0.0"
    port: 8004
    description: "Web scraping and crawling service"
  
  chat:
    host: "0.0.0.0"
    port: 8005
    description: "Chat and conversation management service"
  
  auth:
    host: "0.0.0.0"
    port: 8006
    description: "User authentication and authorization service"

# Database configuration
database:
  url: "sqlite:///./data/rag_chat_room_web.db"
  echo: false

# Redis configuration (for caching and session management)
redis:
  url: "redis://localhost:6379"
  db: 0

# Vector store configuration
vector_store:
  path: "data/vector_store"
  collection_name: "default"

# Embedding configuration
embedding:
  model: "all-MiniLM-L6-v2"
  dimension: 384

# LLM configuration
llm:
  model: "gpt-3.5-turbo"
  temperature: 0.7
  max_tokens: 1000

# OpenAI configuration
openai:
  api_key: ""  # Set via environment variable OPENAI_API_KEY

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/rag_chat_room_web.log"

# CORS configuration
cors:
  allow_origins: ["*"]
  allow_credentials: true
  allow_methods: ["*"]
  allow_headers: ["*"]

