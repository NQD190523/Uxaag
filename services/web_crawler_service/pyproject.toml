[tool.poetry]
name = "web-crawler-service"
version = "0.1.0"
description = "Fetches web pages, converts them to Markdown and saves them into a room's documents"
authors = ["NQD190523 <duc19052003@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.128.0,<0.129.0"
uvicorn = { version = ">=0.40.0,<0.41.0", extras = ["standard"] }
pydantic = ">=2.12.0,<3.0.0"
python-dotenv = ">=1.2.1,<2.0.0"
# Page fetching and calls to the gateway (membership check, saving into document-service).
httpx = ">=0.28.1,<0.29.0"
# HTML cleanup and HTML -> Markdown conversion (services/html_to_markdown.py).
beautifulsoup4 = ">=4.12.0,<5.0.0"
markdownify = ">=0.13.0,<2.0.0"
shared = { path = "../../libs/shared", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.2,<10"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
