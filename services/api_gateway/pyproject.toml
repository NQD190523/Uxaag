[tool.poetry]
name = "api-gateway"
version = "0.1.0"
description = ""
authors = ["NQD190523 <duc19052003@gmail.com>"]
readme = "README.md"
package-mode = false  # use Poetry only for dependency management

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.128.0,<0.129.0"
uvicorn = ">=0.40.0,<0.41.0"
httpx = ">=0.28.1,<0.29.0"
python-dotenv = ">=1.2.1,<2.0.0"
pyyaml = ">=6.0.3,<7.0.0"
slowapi = ">=0.1.9,<0.2.0"
pyjwt = ">=2.10.1,<3.0.0"
python-jose = { version = ">=3.5.0,<4.0.0", extras = ["cryptography"] }
shared = { path = "../../libs/shared", develop = true }

[tool.poetry.group.dev.dependencies]
fastapi = "^0.128.0"
uvicorn = "^0.40.0"
httpx = "^0.28.1"
pytest = "^9.0.2"
black = "^25.12.0"
ruff = "^0.14.10"
mypy = "^1.19.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
